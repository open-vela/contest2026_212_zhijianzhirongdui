# Competition LAN broker. Keep port 1883 behind the team's own hotspot/LAN;
# this permissive profile is intentionally not suitable for public Internet use.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
